[project]
name = "Wallpaper Studio"
version = "1.0.0"
description = "Beautiful wallpaper manager for Android"
requires-python = ">=3.10"
dependencies = [
    "flet>=0.27.0",
    "pyjnius>=1.6.1",
    "requests"
]

[tool.flet]
org = "todayQoute"
product = "AD test2"
company = "Your Company"
copyright = "Copyright (C) 2025"
# for Android
[tool.flet.android.meta_data]
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-3940256099942544~3347511713"

# for iOS
[tool.flet.ios.info]
GADApplicationIdentifier = "ca-app-pub-3940256099942544~3347511713"

[tool.flet.android]
permissions = [
    "android.permission.INTERNET",
    "android.permission.READ_EXTERNAL_STORAGE",
    "android.permission.WRITE_EXTERNAL_STORAGE",
    "android.permission.SET_WALLPAPER",
]

include_packages = ["requests"]

dependencies=["flet","flet-permission-handler","flet-ads==0.1.0"]

min_sdk_version = 26
target_sdk_version = 35
build_gradle_dependencies = []

[build-system]
requires = ["flet-build"]
build-backend = "flet.build"