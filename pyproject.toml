[project]
name = "Wallpaper Studio"
version = "1.0.0"
description = "Beautiful wallpaper manager for Android"
requires-python = ">=3.10"
dependencies = [
    "flet>=0.27.0",
    "pyjnius>=1.6.1",
]

[tool.flet]
org = "com.wallpaper"
product = "WallpaperStudio"
company = "Your Company"
copyright = "Copyright (C) 2025"

[tool.flet.android.permission] # --android-permissions
"android.permission.CAMERA" = true
"android.permission.CAMERA" = true
"android.permission.INTERNET" =true
"android.permission.READ_EXTERNAL_STORAGE" =true
"android.permission.WRITE_EXTERNAL_STORAGE" =true
"android.permission.SET_WALLPAPER"=true
[tool.flet.android]

include_packages = ["pyjnius"]

dependencies=["flet","flet-permission-handler"]

min_sdk_version = 26
target_sdk_version = 35
build_gradle_dependencies = []

[build-system]
requires = ["flet-build"]
build-backend = "flet.build"