# .github/workflows/build-android.yml
name: Build Android APK via Flet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: '17'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet,flet-permission-handler,pyjnius

      - name: Build APK
        id: build-apk
        run: |
          flet build apk --debug --split-per-abi --verbose

      - name: List APK files
        if: success()
        run: |
          cd build/apk
          echo "📱 Generated APK files:"
          ls -la *.apk
          echo ""
          echo "📊 File sizes:"
          du -h *.apk

      - name: Upload single APK (armeabi-v7a)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xo-game-app
          path: build/apk/app-armeabi-v7a-release.apk
          retention-days: 30

      - name: Show upload confirmation
        if: success()
        run: |
          echo "✅ تم رفع ملف APK بنجاح!"
          echo "📱 الملف: app-armeabi-v7a-release.apk"
          echo "🔗 يمكنك تحميله من قسم Artifacts في هذه العملية"
